# AI-Polish Nginx 站点配置（由 deploy.sh 安装到 sites-available 或 conf.d）
# 基线即 HTTPS：80 只负责 ACME 验证与 301 跳转，业务流量全部走 443。
#
# 443 块随本文件附带但整体注释——证书在 certbot 签发前不存在，先启用会让
# nginx -t 失败、deploy.sh 中止。启用步骤见 docs/deployment.md §7：
#   1. sudo certbot certonly --webroot -w /var/www/certbot -d <域名>
#   2. 取消下方 443 块注释并核对证书路径，nginx -t && systemctl reload nginx
# 签发就绪前站点经 80 一律跳向尚未存在的 HTTPS，属预期（上线前完成 §7）。

server {
    listen 80;
    server_name _;

    # certbot webroot 验证：签发/续期必须经 80 明文可达（^~ 优先于下方跳转）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余请求一律跳 HTTPS，JWT cookie 与卡密不允许明文传输
    location / {
        return 301 https://$host$request_uri;
    }
}

