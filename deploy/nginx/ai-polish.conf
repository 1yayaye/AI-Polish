# AI-Polish Nginx 站点配置（由 deploy.sh 安装到 sites-available 或 conf.d）
# 生产请配合 HTTPS（certbot）使用；本样例先提供 HTTP 基线。

server {
    listen 80;
    server_name _;

    root /opt/ai-polish/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的构建产物：长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 业务 API 反代。卡密/JWT 只经请求头传递、绝不进 URL，避免落入访问日志
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        # M2 的 SSE 流式响应需要关闭缓冲
        proxy_buffering off;
    }

    # 进程健康探针；access_log 关闭避免噪音
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
}
