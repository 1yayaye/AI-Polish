# AI-Polish 生产站点变体：域名经 Cloudflare 橙云代理、回源本端口（见 ADR-0006）。
# 源站不做 TLS——HTTPS 由 Cloudflare 边缘终结，回源为 HTTP。
# 每次 deploy.sh 会用 ai-polish.conf（80/443 直连变体）覆盖站点文件，
# 本拓扑下部署后需重新套用本文件：
#   cp deploy/nginx/ai-polish-cloudflare.conf /etc/nginx/sites-available/ai-polish.conf
#   nginx -t && systemctl reload nginx

server {
    listen 9800;
    server_name _;

    root /opt/ai-polish/frontend/dist;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 请求体护栏（M4-T7）：须 ≥ 上传文件上限 MAX_WORD_UPLOAD_MB（.env，默认
    # 20）加 multipart 封装余量，故 21m；调大 .env 上限时同步调大此处
    client_max_body_size 21m;

    location / { try_files $uri $uri/ /index.html; }
    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        # SSE 流式响应需要关闭缓冲
        proxy_buffering off;
    }

    location = /health { proxy_pass http://127.0.0.1:8000/health; access_log off; }
}
